/* =========================================================================

/* =========================================================================

}
const DB = generate();

/* =========================================================================
   3. KPI ENGINE — coach level. Raw numerators/denominators per coach,
      summed to block and district; every rate is Σnum ÷ Σden.
   ========================================================================= */
const NT = DB.teachers.length;
const TC = Int32Array.from(DB.teachers.map(t => t.coach));
const TS = Int32Array.from(DB.teachers.map(t => t.school));

function blankRaw() {
  return { target: 0, lag: [0, 0, 0, 0, 0, 0], chgN: Array(NQ).fill(0), chgSum: Array(NQ).fill(0), chgUp: Array(NQ).fill(0), chgDown: Array(NQ).fill(0), deployed: 0, coaches: 0, schoolsAllotted: 0, schoolsVisited: 0, teachersAllotted: 0, teachersObserved: 0,
    dist: [0, 0, 0, 0, 0, 0], distAllotted: 0, validSum: 0, compMet: Array(NQ).fill(0), compDen: Array(NQ).fill(0),
    adoptMet: 0, adoptDen: 0, adoptQ: Array(NQ).fill(0), engMet: 0, engDen: 0, noResp: 0, totalResp: 0,

function addRaw(a, b) { for (const k in a) { if (Array.isArray(a[k])) a[k].forEach((_, i) => { a[k][i] += b[k][i]; }); else a[k] += b[k]; } return a; }

function aggregate(win, priority) {

function inactiveAt(asOf) {

}
const covAvg = (A, ids) => { let s = 0, n = 0; ids.forEach(c => { const r = A.K[c]; if (r.teachersAllotted > 0) { s += r.teachersObserved / r.teachersAllotted; n++; } }); return n ? (100 * s) / n : null; };

  // per school: visited in the current quarter? last visit ever (≤ asOf)
  const q = qOf(asOf); const set = new Set(ids); const last = new Int16Array(DB.schools.length).fill(-1);

function coByCoach(win) {

  const k = DB.coaches.map(blank);
  DB.co.forEach(x => { if (x.day < win.from || x.day > win.to) return; const r = k[x.c]; r.co++;
    for (let j = 0; j < NQ; j++) { const a = DB.O.resp[x.i * NQ + j], b = x.sef[j]; if (!a || !b) continue; const ag = a === b ? 1 : 0, d = a - b;
      r.n++; r.agree += ag; r.abs += Math.abs(d); r.bias += d; const t = r.q[j]; t.n++; t.agree += ag; t.abs += Math.abs(d); t.bias += d; } });

}
function sefSum(k, ids) {
  const o = { co: 0, n: 0, agree: 0, abs: 0, bias: 0, q: Array.from({ length: NQ }, () => ({ n: 0, agree: 0, abs: 0, bias: 0 })) };
  ids.forEach(c => { const r = k[c]; o.co += r.co; o.n += r.n; o.agree += r.agree; o.abs += r.abs; o.bias += r.bias; r.q.forEach((v, j) => { const t = o.q[j]; t.n += v.n; t.agree += v.agree; t.abs += v.abs; t.bias += v.bias; }); });

function VCol({ rows, target, targetLabel, unit = '%', max, onSelect, height = 340, decimals = 0 }) {

      <KpiCard title="Competency benchmark" value={S.m.compLow ? f1(S.m.compLow.v) : '—'} status={st.comp} gauge={{ v: S.m.compLow ? S.m.compLow.v : null, max: 100, tint: '#DCE6F7' }} onClick={() => go('competency')} sub={S.m.compLow ? <>Lowest: {Q_LABEL[S.m.compLow.q]} ({f0(S.m.compLow.v)}) · Highest: {Q_LABEL[hiQ(S.m)]} ({f0(S.m.compMax)})</> : 'No valid observations'} targetLabel={t == null ? 'X%' : `${t}%`} delta={<Delta cur={S.m.compLow && S.m.compLow.v} prev={P && P.m.compLow && P.m.compLow.v} label={vs} />} />
      <KpiCard title="Student engagement" value={f1(S.m.eng)} status={st.eng} gauge={{ v: S.m.eng, max: 100, tint: '#FBE6D6' }} onClick={() => go('engagement')} sub={<><b className="text-ink num">{nf(S.m.engMet)}</b> of <b className="text-ink num">{nf(S.m.engDen)}</b> observed teachers met the benchmark on at least 2 of the 3 student engagement questions</>} targetLabel={te == null ? 'X%' : `${te}%`} delta={<Delta cur={S.m.eng} prev={P && P.m.eng} label={vs} />} />
      <KpiCard title="Teachers per coach" value={S.load == null ? '—' : Math.round(S.load)} unitNote="average caseload" gauge={{ v: S.load, max: Math.max(50, Math.ceil((S.load || 0) / 10) * 10), mark: settings.caseloadMax, tint: '#DFF1E3' }} status={settings.caseloadMax != null && S.load > settings.caseloadMax ? 'red' : 'grey'} onClick={() => go('coverage')} sub={<><b className="text-ink num">{nf(S.coaches)}</b> active coaches · {nf(S.m.distAllotted)} allotted teachers</>} targetLabel="capacity input" delta={null} />
      <KpiCard title="Coaches with no observation in 14 days" info={`Counts coaches who have not submitted any observation form in the 14 days up to today. Only coaches who have been in the programme for at least 14 days, and have not left, are counted; this is the \u201cof\u201d number. New joiners are left out until they complete 14 days. The period filter does not change this card; it always shows the latest 14 days. Up to ${settings.inactiveThreshold} idle coaches are allowed in the first six months, and none after that.`} value={nf(S.idle)} unitNote={`of ${nf(S.elig)} (${f1(S.idlePct)})`} status={st.idle} gauge={{ v: S.idle, max: Math.max(1, S.elig), tint: '#E6E1F4' }} targetLabel={`0 (≤${settings.inactiveThreshold})`} delta={null} />
      <KpiCard title="Change in competency (Q1–Q8)" value={S.chg ? sgn(S.chg.mean) : '—'} unitNote="mean levels" status={st.chg} gauge={{ tint: '#FBF0D3', custom: S.chg ? <SplitBar parts={[{ label: 'improved', v: S.chg.up, color: '#7BA3D4' }, { label: 'same', v: S.chg.same, color: '#C3CBD5' }, { label: 'declined', v: S.chg.down, color: '#E0A9B3' }]} /> : null }} sub={S.chg ? <><b className="text-ink num">{nf(S.chg.n)}</b> matched ratings</> : 'No matched ratings'} targetLabel="No target" delta={null} />
      <KpiCard title="SEF vs coach agreement" value={S.sef.n ? f1(S.sef.rate) : '—'} status={st.sef} gauge={{ v: S.sef.n ? S.sef.rate : null, max: 100, mark: settings.sefTarget == null ? SEF_IDEAL : settings.sefTarget, tint: '#F1EADF' }} sub={<>% of ratings where SEF and coach agreed · <b className="text-ink num">{nf(S.sef.co)}</b> co-observations · <span className="inline-block w-[3px] h-3 rounded-full bg-ink align-[-1px] mr-1" /> ideal {settings.sefTarget == null ? SEF_IDEAL : settings.sefTarget}%</>} targetLabel={settings.sefTarget == null ? 'ideal 70%' : `${settings.sefTarget}%`} delta={<Delta cur={S.sef.n ? S.sef.rate : null} prev={P && P.sef.n ? P.sef.rate : null} label={vs} />} />
    </div>
    <div className="grid gap-4 grid-cols-1 xl:grid-cols-2">
      <Panel title={`Teacher coverage by ${lvl.toLowerCase()}`} formula={`${KPI.cov.formula} ${KPI.cov.action}`} right={<button onClick={() => go('coverage')} className="text-[12px] text-teal hover:underline inline-flex items-center gap-1">Details <Icon name="ArrowRight" size={13} /></button>}>
        <VCol rows={covRows} target={complete ? 100 : null} targetLabel="Target 100%" onSelect={drill} />{legend(false)}
      </Panel>
      <Panel title={`Observations per teacher by ${lvl.toLowerCase()}`} formula={`Average observations per allotted teacher this financial year (1 Apr to ${fmtDay(p.asOf)}), against the pace towards ${settings.annualTarget} a year (${fyPace.toFixed(2)} today). ${KPI.dist.action}`}>
        <VCol rows={obsRows} unit="num" decimals={1} onSelect={drill} />{legend(true)}
      </Panel>
    </div>
    <SectionTable title="KPI summary"
      periodLabel={periodLabel} rowLabel={lvl} rows={tblRows} total={total} totalLabel={`${scopeName} (total)`} onOpen={id => id !== 'total' && drill(id)} kpis={kpis} labelWidth={LW(level)} />
  </div>;
}

/* ---------------- Coverage & caseload ---------------- */
function CoveragePage(p) {
  const { S, P, st, rows, rowSt, level, drill, settings, pace, complete, prevLabel, mTrend, scopeIds, f, covOf, cur, fy, asOf, setCoach, setBlock, coach, fyPace } = p;
  const [q, setQ] = useState(''); const [sort, setSort] = useState('cov');
  const lvl = lvlLabel(level).toLowerCase();
  const covRows = [...rows].sort((a, b) => (a.cov ?? -1) - (b.cov ?? -1)).map(r => ({ id: r.id, name: r.name, value: r.cov, status: rowSt(r).cov, tip: [['Allotted teachers', nf(r.m.teachersAllotted)], ['Observed', nf(r.m.teachersObserved)], ['Not observed', nf(r.m.teachersAllotted - r.m.teachersObserved)], ['Pooled coverage', f1(r.covPooled)]] }));
  const trend = mTrend.map(({ mo, A }) => ({ label: mo.short, value: covOf(A, scopeIds, scopeRaw(A, f)), pooled: derive(scopeRaw(A, f)).teacherCov }));
  const coaches = scopeIds.filter(c => cur.K[c].coaches).map(c => { const r = cur.K[c]; const co = DB.coaches[c]; return { id: c, co, name: co.code, block: placeOf(co.block), load: r.distAllotted, allot: r.teachersAllotted, obs: r.teachersObserved,
    cov: r.teachersAllotted ? (100 * r.teachersObserved) / r.teachersAllotted : null, fy: derive(fy.K[c]).meanObs, last: cur.lastSub[c] }; });
  const list = coaches.filter(x => `${x.name} ${x.block}`.toLowerCase().includes(q.trim().toLowerCase())).sort((a, b) => sort === 'cov' ? (a.cov ?? -1) - (b.cov ?? -1) : sort === 'load' ? b.load - a.load : a.name.localeCompare(b.name));
  const loadRows = [...coaches].sort((a, b) => b.load - a.load).slice(0, 25).map(x => ({ id: x.id, name: x.name, value: x.load, status: settings.caseloadMax != null && x.load > settings.caseloadMax ? 'red' : 'grey', tip: [['Where', x.block], ['Teachers allotted', nf(x.load)]] }));
  const loads = coaches.map(x => x.load); const avg = loads.length ? loads.reduce((a, b) => a + b, 0) / loads.length : null;
  const covSt = v => hb(v, pace, settings.band);
  return <div className="flex flex-col gap-4">
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
      <Tile label={`Teacher coverage (${settings.covMethod === 'avg' ? 'averaged across coaches' : 'all teachers combined'})`} value={f1(S.cov)} status={st.cov} info={`${settings.covMethod === 'avg' ? 'Each coach’s coverage is the % of their allotted teachers who had at least one observation in the selected period. This card is the average of those coach percentages; for example, one coach at 40% and another at 60% gives 50%.' : 'All allotted teachers in scope who had at least one observation in the selected period ÷ all allotted teachers in scope. Every teacher counts equally, whichever coach they belong to.'} Coverage is on track when it is at least the share of the quarter that has passed (${f0(pace)} today); by the end of the quarter the target is 100%.`} sub={<Delta cur={S.cov} prev={P && P.cov} label={prevLabel ? `vs ${prevLabel}` : ''} />} />
      <Tile label="Teachers observed" value={`${nf(S.m.teachersObserved)} / ${nf(S.m.teachersAllotted)}`} info="Teachers with at least one submitted observation form in the selected period, out of all teachers allotted to coaches. Each teacher counts once, however many times they were observed. Only teachers of coaches active in the period are included. The line below shows how many are not yet observed." sub={`${nf(S.m.teachersAllotted - S.m.teachersObserved)} not yet observed`} />
      <Tile label="Average caseload" info="Average number of teachers allotted to each coach in scope. The range shows the smallest and largest caseload among those coaches." value={avg == null ? '—' : avg.toFixed(0)} sub={loads.length ? `teachers per coach · range ${Math.min(...loads)}–${Math.max(...loads)}` : ''} />
      <Tile label="Coaches behind expected" info={`Coaches whose own teacher coverage is more than ${settings.band} points below ${complete ? 'the 100% target' : `the expected ${f0(pace)} for today, which is the share of the quarter that has passed`}. The coach table below lists each coach’s coverage.`} value={`${coaches.filter(x => x.cov != null && x.cov < pace - settings.band).length} of ${coaches.length}`} sub={`more than ${settings.band} points behind ${complete ? 'target' : `the expected ${f0(pace)} for today`}`} />
    </div>
    <div className="grid gap-4 grid-cols-1 xl:grid-cols-2">
      <Panel title={`Coverage by ${lvl}`} formula={`${KPI.cov.formula} ${KPI.cov.action}`}
        views={[{ label: 'Coverage %', node: <VCol rows={covRows} target={complete ? 100 : null} targetLabel="Target 100%" onSelect={drill} height={320} /> },
          { label: 'Over time', node: <Trend data={trend} lines={[{ key: 'value', name: 'Average across coaches', color: C.teal }, { key: 'pooled', name: 'All teachers combined', color: C.navy, dash: true }]} target={100} height={320} /> }]} />
      <Panel title="Teachers allotted per coach (caseload)" formula={`${KPI.load.formula} ${KPI.load.action}${settings.caseloadMax == null ? ' Set a maximum caseload under Targets to flag coaches above it.' : ` Coaches above ${settings.caseloadMax} are shown in red.`}${coaches.length > 25 ? ` Largest 25 of ${coaches.length} coaches shown.` : ''}`}
        right={<span className="text-[12px] text-muted">{settings.caseloadMax == null ? 'No target · capacity input' : `Max ${settings.caseloadMax}`}</span>}>
        <HBar rows={loadRows} unit="count" max={Math.ceil((Math.max(...loadRows.map(r => r.value || 0), settings.caseloadMax || 0) * 1.15 + 1) / 5) * 5} target={settings.caseloadMax} targetLabel={settings.caseloadMax != null ? `Max ${settings.caseloadMax}` : undefined} onSelect={id => { setBlock(DB.coaches[id].block); setCoach(id); }} labelWidth={110} />
      </Panel>
    </div>
    <Panel title="Coach table" formula={`Each coach against their own allotment. Caseload sits under the coach ID. Coverage is ${complete ? 'against 100%' : `read against today’s pace (${f0(pace)})`}. Click a coach to focus the dashboard on them.`}
      right={<><Search id="ct-q" value={q} onChange={setQ} placeholder="Search coach or block" /><Seg options={['Lowest coverage', 'Largest caseload', 'Name']} value={['cov', 'load', 'name'].indexOf(sort)} onChange={i => setSort(['cov', 'load', 'name'][i])} /></>}>
      <DataTable head={[{ l: 'Coach' }, { l: 'Teachers observed', r: 1 }, { l: 'Coverage', r: 1 }, { l: 'Not observed', r: 1 }, { l: 'Obs / teacher FYTD', r: 1 }, { l: 'Last submission' }]} rows={list} empty="No coaches match."
        render={x => <tr key={x.id} onClick={() => { setBlock(x.co.block); setCoach(x.id); }} className={`border-b border-[#F0F2F5] hover:bg-[#F6FAFA] cursor-pointer ${coach === x.id ? 'bg-[#EAF4F5]' : ''}`}>
          <td className="pl-5 pr-3 py-2"><div className="font-medium text-navy">{x.name}</div><div className="text-[11px] text-muted">{x.block} · caseload <b style={{ color: settings.caseloadMax != null && x.load > settings.caseloadMax ? '#9E2A22' : C.ink }}>{x.load}</b> teachers</div></td>
          <td className="px-3 text-right num">{nf(x.obs)} / {nf(x.allot)}</td>
          <td className="px-3 text-right"><span className="inline-block min-w-[52px] rounded px-1.5 py-0.5 num font-medium" style={quietStyle(covSt(x.cov))}>{f0(x.cov)}</span></td>
          <td className="px-3 text-right num">{nf(x.allot - x.obs)}</td>
          <td className="px-3 text-right num"><span style={{ color: x.fy != null && x.fy < fyPace * 0.85 ? '#9E2A22' : C.ink }}>{x.fy == null ? '—' : x.fy.toFixed(2)}</span></td>
          <td className="px-3 pr-5 whitespace-nowrap">{lastLabel(x.last, asOf)}</td></tr>} />
    </Panel>
  </div>;
}

/* ---------------- Teacher competencies ---------------- */
function CompetencyPage(p) {
  const { S, P, st, rows, level, drill, settings, setShowSettings, qTrend, f, compQ, setCompQ, prevLabel, win, cur, scopeName } = p;
  const [below, setBelow] = useState(true); const [q, setQ] = useState('');
  const t = settings.compTarget; const band = settings.band; const lvl = lvlLabel(level); const m = S.m;
  const compRows = COMP_Q.map(k => ({ id: k, name: Q_LABEL[k], value: m.comp[k], status: hb(m.comp[k], t, band), tip: [['Teachers meeting', nf(m.raw.compMet[k])], ['Teachers assessed', nf(m.raw.compDen[k])]] })).sort((a, b) => (a.value ?? 999) - (b.value ?? 999));
  const selQ = compQ ?? (m.compLow ? m.compLow.q : 0);
  const curQ = QUARTERS.find(x => x.from <= win.to && x.end >= win.to);
  const trend = qTrend.map(({ q: qq, A }) => { const s = derive(scopeRaw(A, f)); const o = { label: qq.short }; COMP_Q.forEach(k => { o['q' + k] = s.comp[k]; }); return o; });
  const alpha = [...rows].sort((a, b) => a.name.localeCompare(b.name));
  const QCOL = ['#12305A', '#1C4478', '#3E6EA5', '#0E7C86', '#5FAAB0', '#D98A00', '#C8372D', '#7A5BA6'];
  const teachers = useMemo(() => DB.teachers.filter(tc => inScopeCoach(DB.coaches[tc.coach], f)).map(tc => ({ t: tc, v: cur.snap.lastQ[tc.id * NQ + selQ], d: cur.snap.lastQDay[tc.id * NQ + selQ] })).filter(x => x.v), [cur, selQ, f.district, f.block, f.coach]);
  const shown = teachers.filter(x => (!below || x.v < 3) && `${x.t.code} ${DB.schools[x.t.school].code} ${DB.coaches[x.t.coach].code}`.toLowerCase().includes(q.trim().toLowerCase())).sort((a, b) => a.v - b.v || DB.coaches[a.t.coach].code.localeCompare(DB.coaches[b.t.coach].code));
  return <div className="flex flex-col gap-4">
    <div className="grid gap-4 grid-cols-1 xl:grid-cols-5">
      <Panel className="xl:col-span-2" title="Competencies, weakest first" formula={`${KPI.comp.formula} ${KPI.comp.action}`}
        right={<><Pill status={st.comp} label={t == null ? 'Target X% · awaiting baseline' : `Target ${t}%`} />{t == null && <button onClick={() => setShowSettings(true)} className="text-[12px] text-teal hover:underline">Set target</button>}</>}>
        <HBar rows={compRows} target={t} labelWidth={40} onSelect={k => setCompQ(k)} selectedId={compQ ?? ''} />
        <div className="text-[11px] text-muted mt-1">Click a question to see its trend and the teachers behind it. Change vs {prevLabel || 'previous period'}: {COMP_Q.map(k => { const d = P && P.m.comp[k] != null && m.comp[k] != null ? m.comp[k] - P.m.comp[k] : null; return `${Q_LABEL[k]} ${d == null ? '—' : (d > 0 ? '+' : '') + d.toFixed(1)}`; }).join(' · ')}</div>
      </Panel>
      <Panel className="xl:col-span-3" title="Competencies over time" formula="Teacher-based % meeting the benchmark per question, quarter by quarter. The selected question is drawn thicker.">
        <div style={{ height: 300 }}><ResponsiveContainer width="100%" height="100%">
          <LineChart data={trend} margin={{ top: 10, right: 18, left: -8, bottom: 0 }}>
            <CartesianGrid vertical={false} stroke={C.grid} /><XAxis dataKey="label" tick={{ fontSize: 11, fill: C.muted }} axisLine={{ stroke: C.line }} tickLine={false} />
            <YAxis domain={[0, 100]} ticks={[0, 25, 50, 75, 100]} tickFormatter={v => `${v}%`} tick={{ fontSize: 10.5, fill: C.muted }} axisLine={false} tickLine={false} />
            <Tooltip formatter={(v, n) => [v == null ? '—' : `${Number(v).toFixed(1)}%`, n]} contentStyle={{ fontSize: 12 }} />
            <Legend iconSize={9} wrapperStyle={{ fontSize: 11 }} onClick={e => setCompQ(Number(e.dataKey.slice(1)))} />
            {t != null && <ReferenceLine y={t} stroke={C.navy} strokeDasharray="4 3" />}
            {curQ && <ReferenceLine x={curQ.short} stroke="#B9C3CE" strokeWidth={14} strokeOpacity={0.3} />}
            {COMP_Q.map(k => <Line key={k} type="monotone" dataKey={'q' + k} name={Q_LABEL[k]} stroke={QCOL[k]} strokeWidth={selQ === k ? 3.2 : 1.4} strokeOpacity={selQ === k ? 1 : 0.55} dot={{ r: selQ === k ? 3.5 : 2 }} isAnimationActive={false} connectNulls />)}
          </LineChart></ResponsiveContainer></div>
      </Panel>
    </div>
    <Panel title={`${lvl} × competency`} formula={`% of each ${lvl.toLowerCase()}'s observed teachers meeting the benchmark on each question. ${t == null ? 'Cells are shaded once a target is set.' : `Shaded cells are below ${t}%.`}`}>
      <div className="scroll-x"><table className="text-[12.5px] min-w-[720px] w-full">
        <thead><tr className="text-[11px] text-muted"><th className="text-left py-2 pr-3 font-medium">{lvl}</th>{COMP_Q.map(k => <th key={k} className={`py-2 px-1 font-medium text-center ${selQ === k ? 'text-navy' : ''}`}><button onClick={() => setCompQ(k)} className="hover:underline">{Q_LABEL[k]}</button></th>)}</tr></thead>
        <tbody>{alpha.map(r => <tr key={r.id} className="border-t border-[#F0F2F5]"><td className="py-1 pr-3 whitespace-nowrap"><button onClick={() => drill(r.id)} className="hover:underline text-navy font-medium">{r.name}</button></td>
          {COMP_Q.map(k => { const v = r.m.comp[k]; return <td key={k} className="px-0.5 py-0.5"><div className="rounded text-center py-1.5 num" style={t == null ? { color: C.ink, background: selQ === k ? '#F1F8F8' : undefined } : quietStyle(hb(v, t, band))}>{f0(v)}</div></td>; })}</tr>)}
          <tr className="border-t-2 border-line bg-[#EFEDF8] font-semibold"><td className="py-1.5 pr-3">{scopeName} (total)</td>{COMP_Q.map(k => <td key={k} className="px-0.5 text-center num">{f0(m.comp[k])}</td>)}</tr></tbody></table></div>
    </Panel>
    <Panel title={`${Q_LABEL[selQ]}: teacher-level results`} formula="Each teacher’s latest valid rating on the selected question this period, with the assigned coach for follow-up (per the sheet). Benchmark = Level 3 or above."
      right={<><label htmlFor="cp-below" className="inline-flex items-center gap-1.5 text-[12.5px]"><input id="cp-below" type="checkbox" checked={below} onChange={e => setBelow(e.target.checked)} />Below benchmark only</label><Search id="cp-q" value={q} onChange={setQ} placeholder="Search teacher, school, coach" />
        <div className="flex flex-wrap gap-1">{COMP_Q.map(k => <button key={k} onClick={() => setCompQ(k)} className={`px-2 py-0.5 rounded text-[11.5px] border ${selQ === k ? 'bg-navy text-white border-navy' : 'border-line text-ink hover:bg-canvas'}`}>{Q_LABEL[k]}</button>)}</div></>}>
      <div className="text-[12px] text-muted mb-2">{nf(teachers.filter(x => x.v >= 3).length)} of {nf(teachers.length)} assessed teachers meet the benchmark on {Q_LABEL[selQ]}.</div>
      <DataTable head={[{ l: 'Teacher ID' }, { l: 'School' }, { l: 'District · Block' }, { l: 'Assigned coach' }, { l: 'Latest rating' }, { l: 'Observed' }]} rows={shown} empty="No teachers match."
        render={x => <tr key={x.t.id} className="border-b border-[#F0F2F5]"><td className="pl-5 pr-3 py-2 font-medium">{x.t.code}</td><td className="px-3">{DB.schools[x.t.school].code}</td><td className="px-3 whitespace-nowrap">{placeOf(x.t.block)}</td><td className="px-3 text-navy font-medium">{DB.coaches[x.t.coach].code}</td>
          <td className="px-3"><Pill status={x.v >= 3 ? 'green' : x.v === 1 ? 'red' : 'amber'} small label={LEVEL[x.v]} /></td><td className="px-3 pr-5">{fmtShort(x.d)}</td></tr>} />
    </Panel>
  </div>;
}

/* ---------------- Student engagement ---------------- */
function EngagementPage(p) {
  const { S, P, st, rows, level, drill, settings, setShowSettings, mTrend, f, prevLabel, cur } = p;
  const [below, setBelow] = useState(true); const [q, setQ] = useState('');
  const te = settings.engTarget; const lvl = lvlLabel(level).toLowerCase(); const m = S.m;
  const engRows = [...rows].sort((a, b) => a.name.localeCompare(b.name)).map(r => ({ id: r.id, name: r.name, value: r.m.eng, status: hb(r.m.eng, te, settings.band), tip: [['Meeting ≥2 of Q9–Q11', nf(r.m.engMet)], ['Observed on all three', nf(r.m.engDen)]] }));
  const trend = mTrend.map(({ mo, A }) => { const s = derive(scopeRaw(A, f)); return { label: mo.short, eng: s.eng, q9: s.comp[8], q10: s.comp[9], q11: s.comp[10] }; });
  const teachers = useMemo(() => DB.teachers.filter(tc => inScopeCoach(DB.coaches[tc.coach], f) && cur.snap.eng[tc.id] !== 255).map(tc => ({ t: tc, e: cur.snap.eng[tc.id], d: cur.snap.engDay[tc.id], r: ENG_Q.map(k => cur.snap.lastQ[tc.id * NQ + k]) })), [cur, f.district, f.block, f.coach]);
  const shown = teachers.filter(x => (!below || x.e < 2) && `${x.t.code} ${DB.schools[x.t.school].code} ${DB.coaches[x.t.coach].code}`.toLowerCase().includes(q.trim().toLowerCase())).sort((a, b) => a.e - b.e || DB.coaches[a.t.coach].code.localeCompare(DB.coaches[b.t.coach].code));
  const rc = v => <span className="inline-block w-7 rounded text-center num text-[12px] py-0.5" style={{ background: v === 0 ? '#F1F3F5' : v >= 3 ? '#E6F2E8' : '#FDF1DC', color: v === 0 ? '#9AA4B0' : v >= 3 ? '#1F6B30' : '#8A5600' }}>{v === 0 ? 'NO' : v}</span>;
  return <div className="flex flex-col gap-4">
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-5">
      <Tile label="Teachers observed on all 3 engagement questions" value={`${nf(m.engDen)} (${f1(m.teachersObserved ? (100 * m.engDen) / m.teachersObserved : null)})`} sub={`of ${nf(m.teachersObserved)} teachers observed in the period · ${nf(m.engMet)} meeting the benchmark`} />
      <Tile label="Teachers meeting student engagement benchmark" value={f1(m.eng)} status={st.eng} sub={<Delta cur={m.eng} prev={P && P.m.eng} label={prevLabel ? `vs ${prevLabel}` : ''} />} />
      {ENG_Q.map(k => <Tile key={k} label={`${Q_LABEL[k]} at benchmark`} value={f0(m.comp[k])} sub={`${nf(m.raw.compMet[k])} of ${nf(m.raw.compDen[k])} teachers`} />)}
    </div>
    <div className="grid gap-4 grid-cols-1 xl:grid-cols-5">
      <Panel className="xl:col-span-3" title={`Student engagement by ${lvl}`} formula={`${KPI.eng.formula} ${KPI.eng.action}`} right={<><Pill status={st.eng} label={te == null ? 'Target X%' : `Target ${te}%`} />{te == null && <button onClick={() => setShowSettings(true)} className="text-[12px] text-teal hover:underline">Set target</button>}</>}>
        <HBar rows={engRows} target={te} onSelect={drill} labelWidth={LW(level)} />
      </Panel>
      <Panel className="xl:col-span-2" title="Engagement over time" formula="Month by month for the current scope: the composite KPI and its three questions.">
        <Trend data={trend} lines={[{ key: 'eng', name: 'Composite', color: C.navy }, { key: 'q9', name: 'Q9', color: '#5FAAB0' }, { key: 'q10', name: 'Q10', color: '#D98A00' }, { key: 'q11', name: 'Q11', color: '#9AA4B0' }]} target={te} height={300} />
      </Panel>
    </div>
    <Panel title="Teacher-level results" formula="Each teacher’s latest observation with all three engagement questions rated this period, with the assigned coach for follow-up (per the sheet). Meeting = at benchmark (Level 3+) on at least 2 of the 3."
      right={<><label htmlFor="en-below" className="inline-flex items-center gap-1.5 text-[12.5px]"><input id="en-below" type="checkbox" checked={below} onChange={e => setBelow(e.target.checked)} />Not meeting only</label><Search id="en-q" value={q} onChange={setQ} placeholder="Search teacher, school, coach" /></>}>
      <DataTable head={[{ l: 'Teacher ID' }, { l: 'School' }, { l: 'District · Block' }, { l: 'Assigned coach' }, { l: 'Q9 · Q10 · Q11' }, { l: 'Result' }, { l: 'Observed' }]} rows={shown} empty="No teachers match."
        render={x => <tr key={x.t.id} className="border-b border-[#F0F2F5]"><td className="pl-5 pr-3 py-2 font-medium">{x.t.code}</td><td className="px-3">{DB.schools[x.t.school].code}</td><td className="px-3 whitespace-nowrap">{placeOf(x.t.block)}</td><td className="px-3 text-navy font-medium">{DB.coaches[x.t.coach].code}</td>
          <td className="px-3"><span className="inline-flex gap-1">{x.r.map((v, i) => <span key={i}>{rc(v)}</span>)}</span></td><td className="px-3"><Pill status={x.e >= 2 ? 'green' : 'amber'} small label={`${x.e} of 3 at benchmark`} /></td><td className="px-3 pr-5">{fmtShort(x.d)}</td></tr>} />
    </Panel>
  </div>;
}

/* ---------------- Settings ---------------- */
function SettingsModal({ settings, onClose, onSave }) {
  const [s, setS] = useState(settings);
  const num = (k, v, max = 100) => setS(x => ({ ...x, [k]: v === '' ? null : Math.max(0, Math.min(max, Number(v))) }));
  const field = (id, label, k, hint, ph = 'Not confirmed (X)', max = 100) => <label htmlFor={id} className="flex flex-col gap-1"><span className="text-[12.5px] font-medium text-ink">{label}</span>
    <input id={id} type="number" min="0" max={max} value={s[k] == null ? '' : s[k]} placeholder={ph} onChange={e => num(k, e.target.value, max)} className="h-8 rounded border border-line px-2 text-[13px]" /><span className="text-[11px] text-muted">{hint}</span></label>;
  return <div className="fixed inset-0 z-50 grid place-items-center p-4" role="dialog" aria-modal="true" aria-label="Targets and configuration">
    <div className="absolute inset-0 bg-[#0B1B33]/40" onClick={onClose} />
    <div className="relative bg-white rounded-md shadow-2xl w-full max-w-[600px] max-h-[90vh] overflow-y-auto">
      <div className="px-5 py-3 border-b border-line flex items-center justify-between"><h2 className="font-semibold text-[15px]">Targets and configuration</h2><button onClick={onClose} aria-label="Close" className="p-1 rounded hover:bg-canvas"><Icon name="X" size={18} /></button></div>
      <div className="p-5 flex flex-col gap-4">
        <Note tone="info">From the sheet: teacher coverage 100% of allotment per BRC per quarter, 3 observations per teacher a year, zero idle coaches in every district (up to 5 in the first six months). Competency and engagement stay at X% until baseline data is in; SEF vs coach agreement is decided after the pilot (ideal 70%). Rating change has no target. Kept in this browser only.</Note>
        <div className="grid gap-4 sm:grid-cols-2">
          {field('s-comp', 'Competency target (%)', 'compTarget', 'Sheet: x% · set once baseline data is in.')}
          {field('s-eng', 'Student engagement target (%)', 'engTarget', 'Sheet: x% · set once baseline data is in.')}
          {field('s-idle', 'Idle coaches threshold', 'inactiveThreshold', 'Sheet: 5 in the first six months, then 0.', '', 50)}
          {field('s-ann', 'Observations per teacher per year', 'annualTarget', 'Sheet: 3 is the target annually.', '', 20)}
          {field('s-cl', 'Maximum caseload per coach', 'caseloadMax', 'No target in the sheet; set to flag allotment problems.', 'Not set', 500)}
          {field('s-sef', 'SEF vs coach agreement target (%)', 'sefTarget', 'Sheet: decided after the pilot; ideal 70% (used until set).', 'Ideal 70% (not set)')}
          {field('s-hf', 'High support = this many × the pace', 'highFactor', 'Prototype rule for the high-support list.', '', 10)}
          {field('s-band', 'Amber band (points below target)', 'band', 'Prototype display rule, not from the sheet.', '', 50)}
          <label htmlFor="s-cov" className="flex flex-col gap-1"><span className="text-[12.5px] font-medium text-ink">Coverage roll-up</span>
            <select id="s-cov" value={s.covMethod} onChange={e => setS(x => ({ ...x, covMethod: e.target.value }))} className="h-8 rounded border border-line px-2 text-[13px]">
              <option value="avg">Average of coaches (sheet rule)</option><option value="pooled">Pooled</option></select>
            <span className="text-[11px] text-muted">District coverage shows the average of all block coaches.</span></label>
        </div>
      </div>
      <div className="px-5 py-3 border-t border-line flex justify-between gap-2">
        <button onClick={() => setS(DEFAULT_SETTINGS)} className="text-[12.5px] text-muted hover:text-ink">Reset to defaults</button>
        <div className="flex gap-2"><button onClick={onClose} className="px-3 py-1.5 rounded border border-line text-[12.5px]">Cancel</button>
          <button onClick={() => onSave({ ...s, inactiveThreshold: s.inactiveThreshold ?? 5, annualTarget: s.annualTarget || 3, highFactor: s.highFactor || 3, band: s.band ?? 10 })} className="px-3 py-1.5 rounded bg-navy text-white text-[12.5px] font-medium">Apply</button></div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>

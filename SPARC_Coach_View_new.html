/* =========================================================================

/* =========================================================================

}
const DB = generate();

/* =========================================================================
   3. KPI ENGINE — coach level. Raw numerators/denominators per coach,

   ========================================================================= */
const NT = DB.teachers.length;
const TC = Int32Array.from(DB.teachers.map(t => t.coach));
const TS = Int32Array.from(DB.teachers.map(t => t.school));

function blankRaw() {

    dist: [0, 0, 0, 0, 0, 0], distAllotted: 0, validSum: 0, compMet: Array(NQ).fill(0), compDen: Array(NQ).fill(0),
    adoptMet: 0, adoptDen: 0, adoptQ: Array(NQ).fill(0), engMet: 0, engDen: 0, noResp: 0, totalResp: 0,

function addRaw(a, b) { for (const k in a) { if (Array.isArray(a[k])) a[k].forEach((_, i) => { a[k][i] += b[k][i]; }); else a[k] += b[k]; } return a; }

function aggregate(win, priority) {

function weeklyOnTime(endDay) {

}

function overdueSchools(asOf, f) {

  for (let i = 0; i < DB.firstIdx[asOf + 1]; i++) last[TS[DB.O.t[i]]] = DB.O.day[i];
  return DB.schools.filter(s => { const c = DB.coaches[s.coach]; return inScopeCoach(c, f) && isActive(c, q.from, asOf) && last[s.id] < q.from; })
    .map(s => { const c = DB.coaches[s.coach]; const l = last[s.id]; return { s, c, last: l, days: l >= 0 ? asOf - l : null,

    .sort((a, b) => (b.days == null ? 1e6 : b.days) - (a.days == null ? 1e6 : a.days) || a.s.code.localeCompare(b.s.code));

function pendingForms(asOf, f) {
  const out = []; const { O, firstIdx } = DB;

  DB.pending.forEach(p => { if (p.day <= asOf) out.push({ c: p.c, s: p.s, day: p.day }); });
  return out.filter(p => inScopeCoach(DB.coaches[p.c], f)).map(p => ({ ...p, days: asOf - p.day })).sort((a, b) => b.days - a.days);
}

  grey:     { label: 'Target not set',        fg: '#55606C', bg: '#EEF1F4', dot: '#9AA4B0', bar: '#5E7A99', rank: 0 },
  nodata:   { label: 'No data yet',           fg: '#6B7682', bg: '#F1F3F5', dot: '#C3CAD2', bar: '#C3CAD2', rank: 0 },
  progress: { label: 'In progress',           fg: '#2F5A87', bg: '#E7EFF8', dot: '#4A78A8', bar: '#4A78A8', rank: 0 },
};
const hb = (v, t, band) => (v == null ? 'nodata' : t == null ? 'grey' : v >= t - 1e-9 ? 'green' : v >= t - band ? 'amber' : 'red');
const f1 = v => (v == null ? '—' : `${v.toFixed(1)}%`);
const f0 = v => (v == null ? '—' : `${Math.round(v)}%`);
const nf = v => (v == null ? '—' : v.toLocaleString('en-IN'));
const LEVEL = ['Not observed', 'Level 1', 'Level 2', 'Level 3', 'Level 4'];
const workDays = (a, b) => { let n = 0; for (let d = a; d <= b; d++) if (dow(d) !== 0) n++; return n; };
const kmOf = sid => 2 + ((sid * 37) % 23) + ((sid * 13) % 10) / 10; // demo distance from the coach's base
const RAG = { green: 'Green', amber: 'Orange', red: 'Red' };

function coachData(cid, q, asOf, priority) {
  const { O, firstIdx } = DB;
  const c = DB.coaches[cid];
  const teachers = DB.teachers.filter(t => t.coach === cid);
  const schools = DB.schools.filter(s => s.coach === cid);
  const from = q.from, to = Math.min(q.end, asOf);
  const mo = MONTHS.find(m => m.from <= to && m.end >= to) || MONTHS[MONTHS.length - 1];
  const hist = {}; teachers.forEach(t => { hist[t.id] = []; });
  const firstSeenT = {}, firstSeenS = {}, schoolLast = {}, monthS = new Set();
  for (let i = 0; i < firstIdx[asOf + 1]; i++) {
    if (O.c[i] !== cid) continue; const t = O.t[i], d = O.day[i], s = DB.teachers[t].school;
    hist[t].push(i); schoolLast[s] = d;
    if (d >= from && d <= to) { if (firstSeenS[s] == null) firstSeenS[s] = d; if (O.valid[i] && firstSeenT[t] == null) firstSeenT[t] = d; }
    if (d >= mo.from && d <= to) monthS.add(s);
  }
  const tInfo = teachers.map(t => {
    const L = hist[t.id]; const inQ = L.filter(i => O.day[i] >= from && O.day[i] <= to && O.valid[i]);
    const q_ = Array(NQ).fill(0);
    inQ.forEach(i => { for (let k = 0; k < NQ; k++) { const v = O.resp[i * NQ + k]; if (v) q_[k] = v; } });
    const engI = [...inQ].reverse().find(i => O.resp[i * NQ + 8] && O.resp[i * NQ + 9] && O.resp[i * NQ + 10]);
    const lastValidAll = [...L].reverse().find(i => O.valid[i]);
    return { t, nQ: inQ.length, latest: inQ.length ? inQ[inQ.length - 1] : -1, q: q_, eng: engI == null ? null : [8, 9, 10].map(k => O.resp[engI * NQ + k]), engDay: engI == null ? -1 : O.day[engI],
      lastAll: lastValidAll != null ? lastValidAll : -1, lastDay: lastValidAll != null ? O.day[lastValidAll] : -1, hist: L };
  });
  const observed = tInfo.filter(x => x.nQ > 0).length;
  const visited = schools.filter(s => firstSeenS[s.id] != null).length;
  const wdTot = workDays(q.from, q.end), wdDone = workDays(q.from, to);
  const expected = Math.min(100, (100 * wdDone) / wdTot);
  const series = []; let ws = q.from - ((dow(q.from) + 6) % 7);
  for (; ws <= to; ws += 7) {
    const we = Math.min(ws + 6, to);
    series.push({ label: fmtShort(Math.max(ws, q.from)),
      teachers: teachers.length ? (100 * Object.values(firstSeenT).filter(d => d <= we).length) / teachers.length : null,
      schools: schools.length ? (100 * Object.values(firstSeenS).filter(d => d <= we).length) / schools.length : null,
      expected: (100 * workDays(q.from, we)) / wdTot });
  }
  const withLatest = tInfo.filter(x => x.latest >= 0);
  const practices = priority.map(k => { const using = withLatest.filter(x => O.resp[x.latest * NQ + k] >= 3); return { k, n: withLatest.length, using: using.length, pct: pct(using.length, withLatest.length), notUsing: withLatest.filter(x => !(O.resp[x.latest * NQ + k] >= 3)) }; });
  const comp = COMP_Q.map(k => { const a = withLatest.filter(x => O.resp[x.latest * NQ + k]); const met = a.filter(x => O.resp[x.latest * NQ + k] >= 3); return { k, n: a.length, using: met.length, pct: pct(met.length, a.length), notUsing: a.filter(x => O.resp[x.latest * NQ + k] < 3) }; });
  const engT = tInfo.filter(x => x.eng); const engMet = engT.filter(x => x.eng.filter(v => v >= 3).length >= 2);
  return { c, teachers, schools, tInfo, observed, visited, teacherCov: pct(observed, teachers.length), schoolCov: pct(visited, schools.length), expected, wdTot, wdDone, series,
    practices, comp, engT, engMet: engMet.length, eng: pct(engMet.length, engT.length), firstSeenS, schoolLast, to, mo, monthVisited: monthS.size };
}

/* ---------------- Visits (pending schools, pending teachers) ---------------- */
function TodoPage(p) {
  const { cd, q, todoTab, setTodoTab, openTeacher } = p;
  const [open, setOpen] = useState({});
  const pendingT = cd.tInfo.filter(x => x.nQ === 0);
  const bySchool = cd.schools.map(s => ({ s, teachers: pendingT.filter(x => x.t.school === s.id), visited: cd.firstSeenS[s.id] != null })).filter(g => g.teachers.length)
    .sort((a, b) => a.visited - b.visited || kmOf(a.s.id) - kmOf(b.s.id));
  const toVisit = cd.schools.filter(s => cd.firstSeenS[s.id] == null).map(s => ({ s, km: kmOf(s.id), last: cd.schoolLast[s.id] })).sort((a, b) => a.km - b.km);
  const tabs = [`1 · Schools to visit (${toVisit.length})`, `2 · Teachers to observe (${pendingT.length})`];
  return <div>
    <h1 className="text-[20px] font-semibold text-ink px-1 mb-1">Plan my visits</h1>
    <p className="text-[12px] text-muted px-1 mb-3">First make sure every allotted school has at least one visit, then reach the remaining teachers in each school. Teacher coverage is the main measure of progress.</p>
    <Chips options={tabs} value={todoTab} onChange={setTodoTab} />
    {todoTab === 0 && <><p className="text-[12px] text-muted px-1 mt-2 mb-3">Schools with no visit since {fmtShort(q.from)}, nearest first. A school counts as visited once any one of its teachers is observed.</p>
      <MCard>{toVisit.length === 0 ? <Empty>Every allotted school has had a visit this quarter.</Empty> : toVisit.map(x => <ListRow key={x.s.id}>
        <span className="w-9 h-9 rounded-xl bg-[#FBE7E5] text-[#9E2A22] grid place-items-center shrink-0"><Icon name="MapPin" size={17} /></span>
        <span className="flex-1 min-w-0"><span className="block text-[13.5px] font-medium">{x.s.code}</span><span className="block text-[11.5px] text-muted">{x.s.nT} teachers · {x.last != null ? `last visit ${fmtShort(x.last)}` : 'never visited'}</span></span>
        <span className="text-[12.5px] font-semibold num whitespace-nowrap">{x.km.toFixed(1)} km</span></ListRow>)}</MCard></>}
    {todoTab === 1 && <><p className="text-[12px] text-muted px-1 mt-2 mb-3">Allotted teachers with no observation since {fmtShort(q.from)}, school by school (schools not yet visited first, then nearest). Tap a teacher to see what was discussed last time.</p>
      {bySchool.length === 0 ? <MCard><Empty>Every allotted teacher has been observed this quarter.</Empty></MCard> :
      <div className="flex flex-col gap-2">{bySchool.map(g => { const isOpen = open[g.s.id] ?? true; return <div key={g.s.id} className="bg-white rounded-2xl border border-[#E4E8EE]">
        <button type="button" onClick={() => setOpen(o => ({ ...o, [g.s.id]: !isOpen }))} aria-expanded={isOpen} className="w-full text-left flex items-center justify-between gap-2 p-3.5">
          <span className="min-w-0"><span className="block text-[14px] font-semibold text-ink">{g.s.code}</span><span className="block text-[11.5px] text-muted">{g.teachers.length} of {g.s.nT} pending · {kmOf(g.s.id).toFixed(1)} km</span></span>
          <span className="flex items-center gap-2">{!g.visited && <Pill status="red" small label="Not visited" />}<Icon name={isOpen ? 'ChevronUp' : 'ChevronDown'} size={16} className="text-muted" /></span></button>
        {isOpen && <div className="px-3.5 pb-1">{g.teachers.map(x => <ListRow key={x.t.id} onClick={() => openTeacher(x.t.id)}><Icon name="User" size={16} className="text-muted" /><span className="flex-1 text-[13.5px] font-medium">{x.t.code}</span><span className="text-[11.5px] text-muted">{x.lastDay >= 0 ? `last ${fmtShort(x.lastDay)}` : 'never observed'}</span><Icon name="ChevronRight" size={15} className="text-muted" /></ListRow>)}</div>}
      </div>; })}</div>}</>}
  </div>;
}

/* ---------------- Practice (best / least prioritised competency) ---------------- */
function PracticePage(p) {
  const { cd, settings, openTeacher } = p;
  const [set, setSet] = useState(0); const [openK, setOpenK] = useState(null); const [mode, setMode] = useState(0);
  const list = set === 0 ? cd.practices : cd.comp;
  const pr = [...list].sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
  const ranked = pr.filter(x => x.pct != null); const best = ranked[0], least = ranked.length > 1 ? ranked[ranked.length - 1] : null;
  const drill = x => {
    if (x.notUsing.length === 0) return <div className="text-[12px] text-muted pb-3 pl-11">Every observed teacher uses this practice.</div>;
    if (mode === 0) return <div className="pb-2">{x.notUsing.map(t => <button type="button" key={t.t.id} onClick={() => openTeacher(t.t.id)} className="w-full text-left flex items-center gap-2 py-1.5 pl-11 text-[12.5px]">
      <span className="flex-1"><span className="font-medium">{t.t.code}</span> <span className="text-muted">· {DB.schools[t.t.school].code}</span></span><Pill status={DB.O.resp[t.latest * NQ + x.k] === 1 ? 'red' : DB.O.resp[t.latest * NQ + x.k] ? 'amber' : 'nodata'} small label={LEVEL[DB.O.resp[t.latest * NQ + x.k]]} /></button>)}</div>;
    const g = {}; x.notUsing.forEach(t => { (g[t.t.school] = g[t.t.school] || []).push(t); });
    const obsBy = {}; cd.tInfo.filter(t => t.latest >= 0).forEach(t => { obsBy[t.t.school] = (obsBy[t.t.school] || 0) + 1; });
    return <div className="pb-2">{Object.entries(g).sort((a, b) => b[1].length - a[1].length).map(([s, ts]) => <div key={s} className="flex items-center gap-2 py-1.5 pl-11 text-[12.5px]">
      <span className="flex-1 font-medium">{DB.schools[s].code}</span><span className="text-muted">{ts.length} of {obsBy[s]} not yet using</span></div>)}</div>;
  };
  return <div>
    <h1 className="text-[20px] font-semibold text-ink px-1 mb-1">My teachers’ practice</h1>
    <p className="text-[12px] text-muted px-1 mb-3">Your own teachers on their latest valid observation this quarter. A coaching aid for planning your next conversations; there is no target.</p>
    <Chips options={['Prioritised practices', 'All Q1–Q8']} value={set} onChange={i => { setSet(i); setOpenK(null); }} />
    <div className="grid grid-cols-2 gap-2.5 mt-3">
      <div className="rounded-2xl p-3.5 bg-[#EEF7F0] border border-[#CFE6D4]"><div className="text-[10.5px] font-semibold text-[#1F6B30] uppercase tracking-wide">Best performing</div><div className="font-cond text-[26px] font-semibold text-ink leading-tight mt-1">{best ? Q_LABEL[best.k] : '—'}</div><div className="text-[11.5px] text-muted">{best ? `${best.using} of ${best.n} teachers (${f0(best.pct)})` : 'No observations yet'}</div></div>
      <div className="rounded-2xl p-3.5 bg-[#FDF5E6] border border-[#F1D9A6]"><div className="text-[10.5px] font-semibold text-[#8A5600] uppercase tracking-wide">Least performing</div><div className="font-cond text-[26px] font-semibold text-ink leading-tight mt-1">{least ? Q_LABEL[least.k] : '—'}</div><div className="text-[11.5px] text-muted">{least ? `${least.using} of ${least.n} teachers (${f0(least.pct)})` : 'No observations yet'}</div></div>
    </div>
    <SecTitle>Tap a practice to see who isn’t using it</SecTitle>
    <MCard title={set === 0 ? `Prioritised: ${settings.priority.map(k => Q_LABEL[k]).join(', ')}` : 'Q1–Q8'} info="% of your teachers at the benchmark (Level 3 or above) on each practice in their latest valid observation this quarter. Drill down teacher-wise or school-wise."
      right={<div className="inline-flex rounded-lg border border-line overflow-hidden text-[11.5px]">{['Teachers', 'Schools'].map((l, i) => <button key={l} type="button" onClick={() => setMode(i)} className={`px-2 py-1 ${mode === i ? 'bg-navy text-white' : 'bg-white text-ink'}`}>{l}</button>)}</div>}>
      {pr.map(x => { const open = openK === x.k; const isB = best && x.k === best.k, isL = least && x.k === least.k; return <div key={x.k} className="border-b border-[#F0F2F5] last:border-0">
        <button type="button" onClick={() => setOpenK(open ? null : x.k)} aria-expanded={open} className="w-full text-left py-3 flex items-center gap-3">
          <span className="w-8 font-semibold text-[13.5px]">{Q_LABEL[x.k]}</span>
          <span className="flex-1"><MBar value={x.pct} color={isL ? '#D98A00' : isB ? '#2E8540' : C.teal} /><span className="block text-[11px] text-muted mt-1">{x.using} of {x.n} teachers{isB ? ' · best' : isL ? ' · least' : ''}</span></span>
          <span className="w-11 text-right font-semibold num text-[14px]">{f0(x.pct)}</span><Icon name={open ? 'ChevronUp' : 'ChevronDown'} size={15} className="text-muted" /></button>
        {open && drill(x)}
      </div>; })}
    </MCard>
  </div>;
}

/* ---------------- Student engagement ---------------- */
function EngagementPage(p) {
  const { cd, settings, openTeacher } = p;
  const [only, setOnly] = useState(0);
  const te = settings.engTarget; const st = hb(cd.eng, te, settings.band);
  const qs = [8, 9, 10].map((k, j) => { const a = cd.engT.filter(x => x.eng[j]); return { k, n: a.length, met: a.filter(x => x.eng[j] >= 3).length }; });
  const rows = cd.engT.map(x => ({ ...x, m: x.eng.filter(v => v >= 3).length })).filter(x => only === 1 || x.m < 2).sort((a, b) => a.m - b.m || a.t.code.localeCompare(b.t.code));
  const notMeet = cd.engT.length - cd.engMet;
  return <div>
    <h1 className="text-[20px] font-semibold text-ink px-1 mb-1">Student engagement</h1>
    <p className="text-[12px] text-muted px-1 mb-3">Teachers meeting the benchmark (Level 3+) on at least 2 of Q9, Q10 and Q11, out of those observed on all three this quarter.</p>
    <MCard>
      <div className="flex items-end justify-between gap-3"><div><div className="font-cond text-[36px] font-semibold leading-none num">{f0(cd.eng)}</div><div className="text-[12px] text-muted mt-1">{cd.engMet} of {cd.engT.length} teachers meet the benchmark</div></div>
        <Pill status={st} label={te == null ? 'Target X%' : `Target ${te}%`} /></div>
      <div className="mt-3"><MBar value={cd.eng} target={te} color={te == null ? C.teal : STATUS[st].bar} /></div>
      <div className="grid grid-cols-3 gap-2 mt-4">{qs.map(x => <div key={x.k} className="rounded-xl bg-canvas p-2.5 text-center"><div className="text-[11px] text-muted">{Q_LABEL[x.k]}</div><div className="font-semibold num text-[16px] mt-0.5">{f0(pct(x.met, x.n))}</div><div className="text-[10.5px] text-muted">{x.met}/{x.n}</div></div>)}</div>
    </MCard>
    <SecTitle>Teachers</SecTitle>
    <Chips options={[`Not meeting (${notMeet})`, `All observed (${cd.engT.length})`]} value={only} onChange={setOnly} />
    <MCard className="mt-2">{rows.length === 0 ? <Empty>Every observed teacher meets the engagement benchmark.</Empty> : rows.map(x => <ListRow key={x.t.id} onClick={() => openTeacher(x.t.id)}>
      <span className="flex-1 min-w-0"><span className="block text-[13.5px] font-medium">{x.t.code}</span><span className="block text-[11.5px] text-muted">{DB.schools[x.t.school].code} · {fmtShort(x.engDay)}</span></span>
      <span className="inline-flex gap-1">{x.eng.map((v, i) => <RateChip key={i} v={v} />)}</span>
      <span className="w-12 text-right"><Pill status={x.m >= 2 ? 'green' : 'amber'} small label={`${x.m}/3`} /></span></ListRow>)}</MCard>
    <div className="text-[11px] text-muted px-1 mt-2">Chips show Q9 · Q10 · Q11 ratings on the latest observation with all three rated.</div>
  </div>;
}

/* ---------------- Teacher history (previous data and next steps) ---------------- */

  const t = sel != null ? cd.tInfo.find(x => x.t.id === sel) : null;
  if (t) {
    const li = t.lastAll; const focus = li >= 0 ? COMP_Q.map(k => ({ k, v: DB.O.resp[li * NQ + k] })).filter(x => x.v && x.v < 3).sort((a, b) => a.v - b.v).slice(0, 3) : [];
    return <div>
      <button type="button" onClick={() => setSel(null)} className="inline-flex items-center gap-1 text-[13px] text-teal mb-2"><Icon name="ChevronLeft" size={16} />All teachers</button>
      <MCard><div className="text-[16px] font-semibold text-navy">{t.t.code}</div><div className="text-[12px] text-muted">{DB.schools[t.t.school].code} · {t.hist.length} observation{t.hist.length === 1 ? '' : 's'} this year · {t.nQ ? 'observed this quarter' : 'not yet observed this quarter'}</div></MCard>

      <SecTitle>All observations</SecTitle>

        <div className="flex items-center justify-between mb-2"><span className="text-[13.5px] font-semibold">{fmtDay(DB.O.day[i])}</span><span className="text-[11px] text-muted">{Q_LABEL.filter((_, k) => DB.O.resp[i * NQ + k] >= 3).length} of 11 at benchmark</span></div>
        <div className="grid grid-cols-6 gap-1.5">{Q_LABEL.map((l, k) => { const v = DB.O.resp[i * NQ + k]; return <div key={l} className="rounded-lg text-center py-1" style={{ background: v === 0 ? '#F1F3F5' : v >= 3 ? '#E6F2E8' : '#FDF1DC', color: v === 0 ? '#9AA4B0' : v >= 3 ? '#1F6B30' : '#8A5600' }}>
          <div className="text-[9.5px] opacity-80">{l}</div><div className="text-[13px] font-semibold num">{v === 0 ? 'NO' : v}</div></div>; })}</div>
      </MCard>)}</div>
    </div>;
  }
  return <div>
    <h1 className="text-[20px] font-semibold text-ink px-1 mb-1">My teachers</h1>
    <p className="text-[12px] text-muted px-1 mb-3">Look up a teacher’s previous observations and the areas to follow up before your visit.</p>
    <label htmlFor="h-search" className="relative block mb-3"><Icon name="Search" size={16} className="absolute left-3 top-3 text-muted" />
      <input id="h-search" value={q} onChange={e => setQ(e.target.value)} placeholder="Search teacher ID or school" className="h-11 w-full pl-9 pr-3 rounded-xl border border-line text-[14px] bg-white" /></label>

      <span className="flex-1 min-w-0"><span className="block text-[13.5px] font-medium">{x.t.code}</span><span className="block text-[11.5px] text-muted">{DB.schools[x.t.school].code} · {x.lastDay >= 0 ? `last ${fmtShort(x.lastDay)}` : 'never observed'}</span></span>

          <label key={id} htmlFor={id} className="flex flex-col gap-1"><span className="text-[12.5px] font-medium">{l}</span><input id={id} type="number" min="0" max={mx} value={s[k] == null ? '' : s[k]} placeholder="Not set (X)" onChange={e => num(k, e.target.value, mx)} className="h-8 rounded border border-line px-2 text-[13px]" /><span className="text-[11px] text-muted">{h}</span></label>)}
        <div><div className="text-[12.5px] font-medium mb-1">Prioritised practices (state to confirm)</div>
          <div className="flex flex-wrap gap-1.5">{COMP_Q.map(k => { const on = s.priority.includes(k); return <button key={k} aria-pressed={on} onClick={() => setS(x => ({ ...x, priority: on ? x.priority.filter(y => y !== k) : [...x.priority, k].sort((a, b) => a - b) }))} className={`px-2.5 py-1 rounded border text-[12px] ${on ? 'bg-navy text-white border-navy' : 'border-line hover:bg-canvas'}`}>{Q_LABEL[k]}</button>; })}</div></div>
      </div>
      <div className="px-5 py-3 border-t border-line flex justify-between gap-2">
        <button onClick={() => setS(DEFAULT_SETTINGS)} className="text-[12.5px] text-muted hover:text-ink">Reset to defaults</button>
        <div className="flex gap-2"><button onClick={onClose} className="px-3 py-1.5 rounded border border-line text-[12.5px]">Cancel</button>
          <button onClick={() => onSave({ ...s, band: s.band ?? 10, priority: s.priority.length ? s.priority : DEFAULT_SETTINGS.priority })} className="px-3 py-1.5 rounded bg-navy text-white text-[12.5px] font-medium">Apply</button></div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
